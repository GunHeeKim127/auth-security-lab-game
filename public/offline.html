<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050b12" />
    <title>로그인 너머 · 오프라인</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b12;color:#eef9fb;font-family:system-ui,sans-serif}.card{width:min(520px,calc(100% - 36px));padding:34px;border:1px solid #1d3443;border-radius:18px;background:#0a141e;box-shadow:0 20px 80px #0008}.mark{width:50px;height:50px;display:grid;place-items:center;border:1px solid #58f0df;border-radius:12px;color:#58f0df;font-weight:800;box-shadow:0 0 24px #58f0df33}h1{font-size:28px;margin:24px 0 10px}p{color:#91a8b8;line-height:1.7}button{margin-top:15px;border:0;border-radius:8px;padding:12px 16px;background:#58f0df;color:#041216;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">LB</div>
      <h1>네트워크 연결이 없습니다</h1>
      <p>한 번 실행한 게임 화면은 오프라인에서도 열 수 있습니다. 처음 방문했다면 네트워크를 연결한 뒤 다시 시도하세요.</p>
      <button onclick="location.reload()">다시 연결</button>
    </main>
  </body>
</html>
